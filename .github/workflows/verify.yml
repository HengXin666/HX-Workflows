name: Verify

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - hygiene/badges/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tg/web/package-lock.json

      - name: Install Python projects
        run: |
          uv sync --project bilibili-api
          uv sync --project emall
          uv sync --project tg
          uv sync --project hygiene

      - name: Install web project
        run: npm ci --prefix tg/web

      - name: Verify
        run: bash scripts/verify.sh
