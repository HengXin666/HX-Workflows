name: hx-browser site gate

# 跑在公开仓，不占 HX-Jungle 的私有 Actions 额度。
# 虚拟桌面（Xvfb）上的对照：
#   本机 Google Chrome / Firefox，有头、无头
#   hx-browser 的每个内核，有头、无头（复用 secret HYGIENE_TOKEN 拉私有仓）
# 火绒是安全软件，不是浏览内核，所以第二列对照是火狐。
# 缺内核或拉不到私有仓时记「未安装」，不当成 0 分。

on:
  pull_request:
    paths:
      - "hx-browser-gate/**"
      - ".github/workflows/hx-browser-sites.yml"
  push:
    branches: [main]
    paths:
      - "hx-browser-gate/**"
      - ".github/workflows/hx-browser-sites.yml"
  workflow_dispatch:
    inputs:
      jungle_ref:
        description: "HX-Jungle 的分支或提交，用来启动指纹浏览器"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检测站结论抽取器
        run: node --experimental-strip-types --test hx-browser-gate/engine.test.ts
      - id: matrix
        run: echo "value=$(jq -c . hx-browser-gate/matrix.json)" >> "$GITHUB_OUTPUT"

  cells:
    needs: readers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJson(needs.readers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 虚拟桌面
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth wget
      - name: 本机谷歌
        if: matrix.cell.browser == 'chrome'
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || sudo apt-get -f install -y
      - name: 本机火狐
        if: matrix.cell.browser == 'firefox'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install -y firefox
      - name: Python 依赖
        run: pip install playwright
      - name: hx-browser 依赖
        if: matrix.cell.group == 'hx'
        run: pip install fastapi 'uvicorn[standard]' websockets pydantic httpx markdown
      - name: 拉私有仓里的 HX-Browser
        id: jungle
        if: matrix.cell.group == 'hx'
        env:
          HYGIENE_TOKEN: ${{ secrets.HYGIENE_TOKEN }}
          REF: ${{ github.event.inputs.jungle_ref || 'main' }}
        run: |
          if [ -z "$HYGIENE_TOKEN" ]; then
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "缺少 Actions secret HYGIENE_TOKEN. 需要一个可读取全部仓库的 classic PAT, 权限勾选 repo."
            exit 0
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: bearer ${HYGIENE_TOKEN}"
          git clone --depth 1 --filter=blob:none --sparse --branch "$REF" \
            https://github.com/HengXin666/HX-Jungle.git \
            "$RUNNER_TEMP/jungle"
          git -C "$RUNNER_TEMP/jungle" sparse-checkout set services/hx-browser
          echo "root=$RUNNER_TEMP/jungle/services/hx-browser" >> "$GITHUB_OUTPUT"
      - name: 打开检测站
        env:
          HX_BROWSER_ROOT: ${{ steps.jungle.outputs.root }}
        run: |
          mkdir -p "$RUNNER_TEMP/cell"
          args=(--group "${{ matrix.cell.group }}" --label "${{ matrix.cell.label }}" --out "$RUNNER_TEMP/cell/${{ matrix.cell.id }}.json")
          if [ "${{ matrix.cell.headed }}" = "true" ]; then args+=(--headed); else args+=(--headless); fi
          if [ -n "${{ matrix.cell.browser }}" ]; then args+=(--browser "${{ matrix.cell.browser }}"); fi
          if [ -n "${{ matrix.cell.kernel }}" ]; then args+=(--kernel "${{ matrix.cell.kernel }}"); fi
          xvfb-run -a -s "-screen 0 1280x900x24" python hx-browser-gate/compare.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.cell.id }}
          path: ${{ runner.temp }}/cell/${{ matrix.cell.id }}.json

  comparison:
    needs: cells
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          path: site-captures
          pattern: site-*
          merge-multiple: true
      - name: 对照表
        run: node hx-browser-gate/report.mjs site-captures comparison.md
      - uses: actions/upload-artifact@v4
        with:
          name: site-comparison
          path: comparison.md
