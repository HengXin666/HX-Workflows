name: 多平台镜像同步

on:
  workflow_dispatch:
    inputs:
      repo_limit:
        description: "只同步这些仓库, 用逗号分隔. 留空表示全部"
        required: false
        type: string
        default: ""
      dry_run:
        description: "试跑: 只列出会做什么, 不建仓、不改可见性、不推送"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * *" # 每天 02:00 (北京时间)

permissions:
  contents: read

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 同步
        env:
          MIRROR_GITHUB_TOKEN: ${{ secrets.MIRROR_GITHUB_TOKEN || secrets.HYGIENE_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          MIRROR_MAIL_TO: ${{ secrets.MIRROR_MAIL_TO }}
          REPO_LIMIT: ${{ inputs.repo_limit }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ -z "$MIRROR_GITHUB_TOKEN" ]; then
            echo "缺少 Actions secret MIRROR_GITHUB_TOKEN (或 HYGIENE_TOKEN). 需要一个能读取全部仓库的 classic PAT, 权限勾选 repo."
            exit 1
          fi
          PYTHONPATH=mirror uv run --project mirror python -m mirror sync \
            --config mirror/config.yml \
            --cache "$RUNNER_TEMP/mirror-cache" \
            --output mirror/output \
            --repo-limit "$REPO_LIMIT" \
            $DRY_RUN

      - name: 保存同步报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-report
          path: mirror/output
          if-no-files-found: ignore
          retention-days: 7
