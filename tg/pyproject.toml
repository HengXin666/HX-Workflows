[project]
name = "hx-tg-workflows"
version = "0.1.0"
description = "Composable scheduled tasks for GitHub Actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pillow>=10.0",
  "PySocks>=1.7.1",
  "PyYAML>=6.0.2",
  "qrcode>=8.2",
  "telethon>=1.42.0",
  "tg-signer>=0.7.0",
]

[dependency-groups]
dev = [
  "ruff>=0.15.22,<0.16",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["web", ".venv"]

[tool.uv]
package = false
